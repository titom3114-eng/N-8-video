<section class="section section--serree" aria-labelledby="appel-titre">
  <div class="conteneur">
    <div class="appel revele">
      <div>
        <h2 id="appel-titre">{{appel_titre}}</h2>
        <p>La visite et le devis sont gratuits et sans engagement. Parlons de votre projet.</p>
      </div>
      <div class="groupe-boutons">
        <a class="btn btn--bleu" href="{{appel_lien}}">{{i:devis}}Demander mon devis</a>
        {{#tel}}<a class="btn btn--contour" href="{{tel_lien}}">{{i:tel}}{{tel}}</a>{{/tel}}
      </div>
    </div>
  </div>
</section>
